# Send /mcp to the ojs-mcp service. Include this inside the site's HTTPS
# <VirtualHost>, e.g.
#
#   Include /etc/apache2/ojs-mcp-apache.conf
#
# Needs: a2enmod proxy proxy_http
#
# Leave ProxyPreserveHost off (the default). ojs-mcp refuses requests that
# arrive on localhost with another site's Host header.
ProxyPass        /mcp http://127.0.0.1:8087/mcp timeout=90
ProxyPassReverse /mcp http://127.0.0.1:8087/mcp

# A call carries at most 1MB of YAML, JSON-encoded.
<Location /mcp>
    LimitRequestBody 2200000
</Location>
